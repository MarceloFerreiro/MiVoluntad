<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Voluntad</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root {
    --bg: #fffdf9;
    /* Mi Voluntad: marrones de la pluma y tonos pergamino del logo */
    --sidebar: #f5ede1;
    --border: #e4d6c1;
    --text: #2b2118;
    --muted: #7a6a58;
    --accent: #7b4f27;
    --accent-soft: #f1e4d1;
    --user-bubble: #7b4f27;
    --user-text: #ffffff;
    --assistant-bubble: #f5ede1;
    --error: #b3261e;
    --error-soft: #fbe9e7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
    display: flex;
  }
  button { font: inherit; cursor: pointer; }

  /* Sidebar */
  aside {
    width: 280px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .brand { padding: 14px 16px 8px; font-weight: 700; font-size: 21px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .logo-big { display: block; margin: 0 auto 16px; }
  .new-chat {
    margin: 8px 12px 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    text-align: left;
  }
  .new-chat:hover { border-color: var(--accent); }
  .conv-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .conv-label { font-size: 13px; color: var(--muted); padding: 8px 8px 4px; }
  .conv {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  .conv:hover { background: #eee3d3; }
  .conv.active { background: var(--accent-soft); }
  .conv .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .del {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 16px;
    padding: 0 4px;
    visibility: hidden;
  }
  .conv:hover .del { visibility: visible; }
  .conv .del:hover { color: var(--error); }
  .sidebar-foot { padding: 12px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  .model-pick { display: block; margin-bottom: 10px; color: var(--text); font-size: 14px; }
  .model-pick select { display: block; width: 100%; margin-top: 4px; padding: 6px; font: inherit; font-size: 15px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .model-pick small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .sidebar-foot button { margin-top: 8px; width: 100%; border: 1px solid var(--border); background: var(--bg);
    border-radius: 8px; padding: 6px; font-size: 14px; color: var(--error); }
  .actions { display: flex; gap: 8px; }
  .action { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 6px 12px; font-size: 15px; }
  .action:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .action.danger:hover:not(:disabled) { border-color: var(--error); background: var(--error-soft); }
  .action:disabled { opacity: 0.4; cursor: not-allowed; }
  .consent { text-align: left; max-width: 640px; margin: 0 auto; background: var(--sidebar); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px 22px; }
  .consent p { margin: 0 0 10px; }
  .consent .buttons { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; }
  .consent a { color: var(--accent); }

  /* Main */
  main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  header .menu { display: none; border: none; background: none; font-size: 22px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .badge { font-size: 13px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; display: inline-block; margin-right: 6px; }
  .status-dot.ok { background: #3aa86b; }
  .status-dot.ko { background: var(--error); }

  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .bubble { padding: 12px 16px; border-radius: 16px; max-width: 85%; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: var(--error-soft); color: var(--error); }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h2, .bubble h3, .bubble h4 { font-size: 1.05em; margin: 14px 0 6px; }
  .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 24px; }
  .bubble li { margin: 3px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .bubble code { background: #eee3d3; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }

  .meta { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .meta summary { cursor: pointer; }
  .source { margin: 8px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .source b { color: var(--accent); }
  .source .ruta { font-size: 12px; }
  .source pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; margin: 6px 0 0; color: var(--text); }
  .attachment-line { font-size: 15px; opacity: 0.9; margin-bottom: 4px; }
  .privacy { margin: 8px 0 0; padding: 8px 10px; background: #fff8e1; border: 1px solid #f0dca0; border-radius: 8px; }
  .privacy pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; margin: 6px 0 0; max-height: 320px; overflow-y: auto; }
  .attach-preview {
    max-width: 780px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px;
  }
  .attach-preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  .attach-preview .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-preview button { border: none; background: none; color: var(--muted); font-size: 18px; }
  .attach { border: 1px solid var(--border); background: var(--bg); font-size: 15px; padding: 8px 10px; border-radius: 10px; color: var(--muted); }
  .attach:hover { color: var(--accent); }
  .attach.recording { background: var(--error); border-color: var(--error); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.7; } }
  .listen-btn {
    align-self: flex-start; margin-top: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--accent);
    border-radius: 999px; padding: 4px 12px; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
  }
  .listen-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .attach:disabled { opacity: 0.35; cursor: not-allowed; }
  /* Ver lo que vio la IA (texto enmascarado) */
  .bubble-wrap { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user .bubble-wrap { align-items: flex-end; }
  .bubble-wrap .bubble { max-width: 100%; }
  .mask-btn {
    align-self: flex-start; margin-top: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    border-radius: 999px; padding: 2px 10px; font-size: 13px; opacity: 0; transition: opacity 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .msg.user .mask-btn { align-self: flex-end; }
  .msg:hover .mask-btn, .mask-btn:focus, .mask-btn[aria-expanded="true"] { opacity: 1; }
  @media (hover: none) { .mask-btn { opacity: 0.6; } }
  .mask-panel {
    margin-top: 6px; padding: 8px 12px; background: #fff8e1; border: 1px solid #f0dca0; border-radius: 10px;
    font-size: 14px; color: var(--text); max-width: 100%;
  }
  .mask-panel .head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .mask-panel pre { white-space: pre-wrap; font-family: inherit; margin: 0; max-height: 300px; overflow-y: auto; }
  /* Respuestas rápidas */
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .option {
    border: 2px solid var(--accent); background: var(--bg); color: var(--accent); border-radius: 12px;
    padding: 10px 18px; font-size: 18px; font-weight: 600;
  }
  .option:hover { background: var(--accent-soft); }
  .retry { margin-top: 8px; border: 1px solid var(--error); color: var(--error); background: none; border-radius: 8px; padding: 4px 10px; font-size: 15px; }

  .typing span {
    display: inline-block; width: 8px; height: 8px; margin: 0 2px;
    background: var(--muted); border-radius: 50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .welcome { text-align: center; margin-top: 8vh; }
  .welcome .logo { font-size: 48px; }
  .welcome h2 { margin: 8px 0; font-size: 28px; }
  .welcome p { color: var(--muted); margin: 0 auto 24px; max-width: 520px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: left;
    max-width: 260px;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* Composer */
  .composer { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  .composer form {
    max-width: 780px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 16px;
  }
  .composer form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: none; outline: none; resize: none;
    font: inherit; max-height: 200px; padding: 6px 0; background: transparent; color: var(--text);
  }
  .send {
    border: none; background: var(--accent); color: #fff;
    border-radius: 12px; padding: 10px 18px; font-weight: 600;
  }
  .send:disabled { background: #c9b49a; cursor: not-allowed; }
  .disclaimer { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 13px; color: var(--muted); }

  .action .short { display: none; }
  @media (max-width: 760px) {
    .action .label { display: none; }
    .action .short { display: inline; }
    aside { position: fixed; z-index: 10; left: -290px; transition: left 0.2s; box-shadow: 0 0 20px rgba(0,0,0,0.15); }
    aside.open { left: 0; }
    header .menu { display: block; }
    .bubble, .bubble-wrap { max-width: 92%; }
    .avatar { display: none; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand"><img src="/assets/logo.png" alt="" width="40" height="40"> Mi Voluntad</div>
  <button class="new-chat" id="newChat">＋ Nueva conversación</button>
  <div class="conv-list" id="convList"></div>
  <div class="sidebar-foot">
    <label class="model-pick">Modelo de IA
      <select id="modelSelect"></select>
      <small id="modelDetail"></small>
    </label>
    <span id="retentionNote">Las conversaciones se guardan cifradas y se borran solas a los 30 días sin uso.</span>
    <button id="deleteAll">Borrar todas mis conversaciones</button>
  </div>
</aside>

<main>
  <header>
    <button class="menu" id="menuBtn" aria-label="Abrir conversaciones">☰</button>
    <h1 id="convTitle">Nueva conversación</h1>
    <div class="actions">
      <button class="action" id="pdfBtn" title="Descargar un PDF con sus respuestas para enseñárselo al notario"><span class="label">Generar borrador</span><span class="short">PDF</span></button>
      <button class="action danger" id="deleteBtn" title="Borrar esta conversación y sus datos del servidor"><span class="label">Borrar mis datos</span><span class="short">Borrar</span></button>
    </div>
    <span class="badge"><span class="status-dot" id="statusDot"></span><span id="statusText">conectando…</span></span>
  </header>

  <div id="messages"><div class="thread" id="thread"></div></div>

  <div class="composer">
    <div class="attach-preview" id="attachPreview" hidden>
      <img id="attachThumb" alt="">
      <span class="name" id="attachName"></span>
      <button type="button" id="attachRemove" title="Quitar foto">✕</button>
    </div>
    <form id="form">
      <button type="button" class="attach" id="attachBtn" title="Adjuntar foto de un documento (por ejemplo, su testamento)">Foto</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button type="button" class="attach" id="micBtn" title="Hablar en lugar de escribir">Hablar</button>
      <textarea id="input" rows="1" placeholder="Escriba aquí su pregunta…" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit">Enviar</button>
    </form>
    <div class="disclaimer">Borrador orientativo, sin validez legal: no sustituye al notario ni a un abogado. A la IA solo le llegan sus datos personales ocultos. <a href="/privacidad" target="_blank">Política de privacidad</a></div>
  </div>
</main>

<script>
// v2: el historial enmascarado y la tabla de correspondencia viven cifrados en el servidor.
// Aquí solo se guarda lo que se ve en pantalla y la clave de cada conversación.
const STORAGE_KEY = "testamento_facil_conversaciones_v2";
try { localStorage.removeItem("testamento_facil_conversaciones_v1"); } catch (e) { /* versión antigua, sin cifrar */ }
const SUGGESTIONS = [
  "Quiero empezar el cuestionario para mi borrador de testamento",
  "¿Qué tipos de testamento hay?",
  "¿Cuánto cuesta hacer testamento en el notario?",
  "¿Hay alguna notaría cerca de donde vivo?",
];
let config = { bienvenida: "", retention_days: 30 };
// Modo desarrollador (?dev en la URL): muestra fragmentos consultados, coste y memoria
const DEV = new URLSearchParams(location.search).has("dev");
const MODEL_KEY = "mi_voluntad_modelo";
function selectedModel() {
  return $("modelSelect").value || config.modelo_por_defecto || "rapido";
}
function setupModelPicker() {
  const select = $("modelSelect");
  let saved = null;
  try { saved = localStorage.getItem(MODEL_KEY); } catch (e) { /* sin almacenamiento */ }
  select.innerHTML = "";
  for (const m of config.modelos || []) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.nombre;
    opt.dataset.detalle = m.detalle;
    select.appendChild(opt);
  }
  select.value = (config.modelos || []).some((m) => m.id === saved) ? saved : config.modelo_por_defecto;
  const showDetail = () => { $("modelDetail").textContent = select.selectedOptions[0]?.dataset.detalle || ""; };
  showDetail();
  select.onchange = () => {
    try { localStorage.setItem(MODEL_KEY, select.value); } catch (e) { /* sin almacenamiento */ }
    showDetail();
  };
}
const EYE = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;

// Separa la línea final "Opciones: A / B" de la respuesta para mostrarla como botones
function splitOptions(text) {
  const m = (text || "").match(/\n?\s*Opciones:\s*([^\n]+)\s*$/);
  if (!m) return { text, options: [] };
  const options = m[1].split("/").map((o) => o.trim().replace(/[.*]+$/, "")).filter(Boolean);
  return { text: text.slice(0, m.index).trimEnd(), options };
}

// Botón (al pasar el ratón) que despliega el texto exacto que recibió o escribió la IA
function maskToggle(maskedText, summary) {
  const frag = document.createDocumentFragment();
  const btn = document.createElement("button");
  btn.className = "mask-btn";
  btn.type = "button";
  btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = EYE + "<span>Ver lo que vio la IA</span>";
  const panel = document.createElement("div");
  panel.className = "mask-panel";
  panel.hidden = true;
  panel.innerHTML = `<div class="head"></div><pre></pre>`;
  panel.querySelector(".head").textContent = summary;
  panel.querySelector("pre").textContent = maskedText;
  btn.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    btn.setAttribute("aria-expanded", String(!panel.hidden));
  });
  frag.append(btn, panel);
  return frag;
}
const MAX_IMAGE_SIDE = 2400;
const PRIVACY_NAMES = {
  PERSONA: "personas", DNI: "DNI", NIE: "NIE", IBAN: "cuentas", TELEFONO: "teléfonos", EMAIL: "emails",
  DIRECCION: "direcciones", REF_CATASTRAL: "ref. catastrales", PROTOCOLO: "nº de protocolo",
  CUENTA: "nº de cuenta", URL: "webs", SECRETO: "claves",
};

// ---------- Estado ----------
let conversations = loadConversations();   // { id: {id, serverId, key, title, createdAt, updatedAt, messages: []} }
let currentId = null;                      // conversación abierta (null = pantalla de bienvenida)
const pending = new Set();                 // ids de conversaciones esperando respuesta
let attachment = null;                     // { name, dataUrl } de la foto pendiente de enviar
let ocrAvailable = false;

function loadConversations() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

// Borrado automático también en este dispositivo: lo que lleva más de N días sin uso
function purgeExpired() {
  const limit = Date.now() - config.retention_days * 24 * 3600 * 1000;
  const expired = Object.values(conversations).filter((c) => c.updatedAt < limit);
  if (expired.length) deleteOnServer(expired.map((c) => c.serverId));
  expired.forEach((c) => delete conversations[c.id]);
  saveConversations();
}

function deleteOnServer(serverIds) {
  return fetch("/api/borrar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ conversation_ids: serverIds.filter(Boolean) }),
  }).catch(() => { /* el servidor las borrará igualmente al caducar */ });
}

function saveConversations() {
  try {
    // Las fotos no se guardan (pesan mucho); solo viven en memoria hasta recargar
    const json = JSON.stringify(conversations, (key, value) => (key === "imageData" ? undefined : value));
    localStorage.setItem(STORAGE_KEY, json);
  } catch (e) {
    /* sin almacenamiento: la sesión sigue funcionando en memoria */
  }
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}


// ---------- Markdown mínimo ----------
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, "$1<em>$2</em>");
}

function renderMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };

  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushPara(); closeList(); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); closeList(); html += "<hr>"; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flushPara(); closeList();
      const level = Math.min(m[1].length + 1, 4);
      html += `<h${level}>${inline(m[2])}</h${level}>`;
      continue;
    }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flushPara();
      if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
      html += `<li>${inline(m[1])}</li>`;
      continue;
    }
    if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))) {
      flushPara();
      if (list !== "ol") { closeList(); html += `<ol start="${m[1]}">`; list = "ol"; }
      html += `<li>${inline(m[2])}</li>`;
      continue;
    }
    closeList();
    para.push(line);
  }
  flushPara(); closeList();
  return html;
}

// ---------- Render ----------
const $ = (id) => document.getElementById(id);

function renderSidebar() {
  const list = $("convList");
  const sorted = Object.values(conversations).sort((a, b) => b.updatedAt - a.updatedAt);
  list.innerHTML = sorted.length ? '<div class="conv-label">Conversaciones</div>' : "";
  for (const conv of sorted) {
    const row = document.createElement("div");
    row.className = "conv" + (conv.id === currentId ? " active" : "");
    row.innerHTML = `<span class="title"></span><button class="del" title="Borrar conversación">✕</button>`;
    row.querySelector(".title").textContent = (pending.has(conv.id) ? "⏳ " : "") + conv.title;
    row.addEventListener("click", () => openConversation(conv.id));
    row.querySelector(".del").addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm(`¿Borrar la conversación "${conv.title}"?`)) deleteConversation(conv.id);
    });
    list.appendChild(row);
  }
}

function renderThread() {
  const thread = $("thread");
  thread.innerHTML = "";
  const conv = conversations[currentId];
  $("convTitle").textContent = conv ? conv.title : "Nueva conversación";

  if (!conv) {
    // Primer mensaje: naturaleza del servicio y consentimiento antes de poder escribir
    thread.innerHTML = `
      <div class="welcome">
        <img class="logo-big" src="/assets/logo.png" alt="Mi Voluntad" width="112" height="112">
        <div class="consent">
          <div class="text"></div>
          <div class="buttons">
            <button class="send" id="acceptBtn">He leído y acepto. Empezar</button>
            <a href="/privacidad" target="_blank">Leer la Política de Privacidad</a>
          </div>
        </div>
      </div>`;
    thread.querySelector(".consent .text").innerHTML = renderMarkdown(config.bienvenida || "Cargando…");
    thread.querySelector("#acceptBtn").addEventListener("click", acceptAndStart);
  } else if (!conv.messages.length) {
    thread.innerHTML = `
      <div class="welcome">
        <h2>Gracias. ¿Por dónde empezamos?</h2>
        <p>Puede empezar el cuestionario o preguntarme cualquier duda. Cuando tengamos lo básico, pulse <b>Generar borrador</b>.</p>
        <div class="chips"></div>
      </div>`;
    const chips = thread.querySelector(".chips");
    for (const s of SUGGESTIONS) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = s;
      chip.addEventListener("click", () => send(s));
      chips.appendChild(chip);
    }
  } else {
    conv.messages.forEach((m, i) => thread.appendChild(renderMessage(m, conv, i)));
    if (pending.has(conv.id)) {
      const typing = document.createElement("div");
      typing.className = "msg assistant";
      typing.innerHTML = `<div class="avatar">TF</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
      thread.appendChild(typing);
    }
  }
  updateComposer();
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

function renderMessage(m, conv, index) {
  const row = document.createElement("div");
  if (m.role === "user") {
    row.className = "msg user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (m.attachment) {
      const line = document.createElement("div");
      line.className = "attachment-line";
      line.textContent = "Foto: " + m.attachment.name;
      bubble.appendChild(line);
    }
    bubble.appendChild(document.createTextNode(m.content));
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    wrap.appendChild(bubble);
    if (m.maskedQuestion) wrap.appendChild(maskToggle(m.maskedQuestion, "Su mensaje tal como lo recibió la IA (datos personales ocultos)"));
    row.appendChild(wrap);
    return row;
  }

  if (m.role === "error") {
    row.className = "msg assistant error";
    row.innerHTML = `<div class="avatar">!</div><div class="bubble"><div class="text"></div></div>`;
    row.querySelector(".text").textContent = m.content;
    const isLast = index === conv.messages.length - 1;
    if (isLast && !pending.has(conv.id)) {
      const retry = document.createElement("button");
      retry.className = "retry";
      retry.textContent = "Reintentar";
      retry.addEventListener("click", () => retryLast(conv.id));
      row.querySelector(".bubble").appendChild(retry);
    }
    return row;
  }

  row.className = "msg assistant";
  row.innerHTML = `<div class="avatar">TF</div><div class="bubble-wrap"><div class="bubble"><div class="text"></div></div></div>`;
  const { text, options } = splitOptions(m.content);
  row.querySelector(".text").innerHTML = renderMarkdown(text);
  const wrap = row.querySelector(".bubble-wrap");

  // Respuestas rápidas: solo en el último mensaje de la conversación
  const isLast = index === conv.messages.length - 1;
  if (options.length && isLast && !pending.has(conv.id)) {
    const box = document.createElement("div");
    box.className = "options";
    for (const o of options) {
      const b = document.createElement("button");
      b.className = "option";
      b.textContent = o;
      // "Generar borrador" como respuesta rápida: genera y descarga el PDF en vez de enviarlo
      if (/generar\s+(el\s+)?borrador/i.test(o)) {
        b.addEventListener("click", async () => {
          b.disabled = true;
          b.textContent = "Preparando el PDF…";
          await downloadDraft();
          b.disabled = false;
          b.textContent = o;
        });
      } else {
        b.addEventListener("click", () => send(o));
      }
      box.appendChild(b);
    }
    row.querySelector(".bubble").appendChild(box);
  }

  const tools = document.createElement("div");
  tools.className = "tools";
  const listen = document.createElement("button");
  listen.className = "listen-btn";
  listen.type = "button";
  listen.textContent = "Escuchar";
  listen.addEventListener("click", () => speak(text + (options.length ? ". Puede responder: " + options.join(", ") : ""), listen));
  tools.appendChild(listen);
  wrap.appendChild(tools);

  if (m.maskedAnswer) {
    const hidden = Object.entries(m.privacySummary || {})
      .map(([type, n]) => `${n} ${PRIVACY_NAMES[type] || type}`).join(", ");
    const head = "Respuesta de la IA antes de poner sus datos reales" + (hidden ? ` (datos ocultos: ${hidden})` : "");
    const toggle = maskToggle(splitOptions(m.maskedAnswer).text, head);
    tools.appendChild(toggle.firstChild);   // botón junto a "Escuchar"
    wrap.appendChild(toggle);               // panel debajo
  }

  if (!DEV) return row;
  const sources = m.sources || [];
  const details = document.createElement("details");
  details.className = "meta";
  const n = m.historyTurns ?? 0;
  const memory = `recordaba ${n} turno${n === 1 ? "" : "s"} anterior${n === 1 ? "" : "es"}`;
  const cost = typeof m.cost === "number" ? ` · $${m.cost.toFixed(5)}` : "";
  details.innerHTML = `<summary>${sources.length ? sources.length + " fragmentos consultados" : "sin búsqueda en los documentos"} · ${memory}${cost}</summary>`;
  for (const s of sources) {
    const div = document.createElement("div");
    div.className = "source";
    div.innerHTML = `<b></b><div class="ruta"></div><pre></pre>`;
    div.querySelector("b").textContent = s.label;
    div.querySelector(".ruta").textContent = s.ruta;
    div.querySelector("pre").textContent = s.texto;
    details.appendChild(div);
  }
  wrap.appendChild(details);
  return row;
}

function updateComposer() {
  const conv = conversations[currentId];
  const busy = currentId !== null && pending.has(currentId);
  const hasAnswers = !!conv && conv.messages.some((m) => m.role === "assistant");
  $("pdfBtn").disabled = !hasAnswers || busy || pdfBusy;
  $("deleteBtn").disabled = !conv || busy;
  $("input").disabled = !conv;
  $("send").disabled = busy || !conv;
  $("attachBtn").disabled = busy || !ocrAvailable || !conv;
  $("micBtn").disabled = (busy || !conv) && !recorder;
  $("attachBtn").title = ocrAvailable
    ? "Adjuntar foto de un documento (por ejemplo, su testamento)"
    : "El OCR no está instalado en el servidor";
  $("input").placeholder = !conv ? "Acepte la política de privacidad para empezar"
    : busy ? "Esperando la respuesta…" : "Escriba aquí su pregunta…";
}

// ---------- Acciones ----------
function openConversation(id) {
  currentId = id;
  $("sidebar").classList.remove("open");
  renderSidebar();
  renderThread();
  $("input").focus();
}

function newConversation() {
  openConversation(null);
}

function deleteConversation(id) {
  const conv = conversations[id];
  if (conv) deleteOnServer([conv.serverId]);
  delete conversations[id];
  saveConversations();
  if (currentId === id) currentId = null;
  renderSidebar();
  renderThread();
}

// Acepta la política: el servidor crea la conversación cifrada y entrega su clave (solo esta vez)
async function acceptAndStart() {
  const btn = $("acceptBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/conversacion", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ acepta_privacidad: true }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    const id = newId();
    conversations[id] = {
      id, serverId: data.conversation_id, key: data.key, title: "Nueva conversación",
      createdAt: Date.now(), updatedAt: Date.now(), messages: [],
    };
    saveConversations();
    openConversation(id);
  } catch (e) {
    btn.disabled = false;
    alert("No se ha podido empezar: " + e.message);
  }
}

let pdfBusy = false;
async function downloadDraft() {
  const conv = conversations[currentId];
  if (!conv || pdfBusy) return;
  pdfBusy = true;
  const label = $("pdfBtn").querySelector(".label");
  label.textContent = "Generando…";
  updateComposer();
  try {
    const res = await fetch("/api/borrador", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conv.serverId, key: conv.key, modelo: selectedModel() }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Error ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url;
    a.download = "borrador_testamento.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    alert("No se ha podido generar el borrador: " + e.message);
  } finally {
    pdfBusy = false;
    label.textContent = "Generar borrador";
    updateComposer();
  }
}

async function send(text, photo = null) {
  text = text.trim();
  if (!text && !photo) return;
  const conv = conversations[currentId];
  if (!conv || pending.has(currentId)) return;
  if (!conv.messages.length) conv.title = text ? (text.length > 45 ? text.slice(0, 45) + "…" : text) : "Foto: " + photo.name;

  const userMsg = { role: "user", content: text };
  if (photo) {
    userMsg.attachment = { name: photo.name };
    userMsg.imageData = photo.dataUrl;
  }
  conv.messages.push(userMsg);
  conv.updatedAt = Date.now();
  saveConversations();
  await requestAnswer(conv.id, userMsg);
}

async function requestAnswer(convId, userMsg) {
  pending.add(convId);
  renderSidebar();
  renderThread();

  let reply;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        conversation_id: conversations[convId]?.serverId,
        key: conversations[convId]?.key,
        modelo: selectedModel(),
        message: userMsg.content,
        image: userMsg.imageData || null,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    if (data.masked_question) userMsg.maskedQuestion = data.masked_question;
    reply = {
      role: "assistant",
      content: data.answer,
      maskedAnswer: data.masked_answer,
      document: data.document,
      privacySummary: data.privacy_summary,
      sources: data.sources,
      cost: data.cost,
      historyTurns: data.history_turns,
    };
    setStatus(true);
  } catch (e) {
    reply = { role: "error", content: "No he podido responder: " + e.message };
    if (e instanceof TypeError) setStatus(false);
  }

  // La respuesta va a SU conversación, aunque el usuario haya cambiado de pestaña o la haya borrado
  pending.delete(convId);
  const conv = conversations[convId];
  if (conv) {
    conv.messages.push(reply);
    conv.updatedAt = Date.now();
    saveConversations();
  }
  renderSidebar();
  if (currentId === convId) renderThread();
}

function retryLast(convId) {
  const conv = conversations[convId];
  if (!conv || pending.has(convId)) return;
  // Quitar el error y reenviar la última pregunta con la memoria anterior a ella
  if (conv.messages.at(-1)?.role === "error") conv.messages.pop();
  const last = conv.messages.at(-1);
  if (!last || last.role !== "user") return renderThread();
  if (last.attachment && !last.imageData) {
    conv.messages.push({ role: "error", content: "La foto ya no está disponible tras recargar la página. Vuelva a adjuntarla con el botón Foto." });
    saveConversations();
    return renderThread();
  }
  requestAnswer(convId, last);
}

async function loadConfig() {
  try {
    const res = await fetch("/api/config");
    config = await res.json();
    setStatus(res.ok, config.model);
    ocrAvailable = !!config.ocr;
    $("retentionNote").textContent =
      `Las conversaciones se guardan cifradas y se borran solas a los ${config.retention_days} días sin uso.`;
    setupModelPicker();
    purgeExpired();
    renderSidebar();
    renderThread();
  } catch (e) {
    setStatus(false);
  }
}

function setStatus(ok, model) {
  $("statusDot").className = "status-dot " + (ok ? "ok" : "ko");
  if (model) $("statusText").textContent = model;
  else if (!ok) $("statusText").textContent = "sin conexión con el servidor";
}

// ---------- Eventos ----------
const input = $("input");
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("send").disabled) return;
  const text = input.value;
  if (!text.trim() && !attachment) return;
  const photo = attachment;
  input.value = "";
  autosize();
  clearAttachment();
  send(text, photo);
});

// ---------- Fotos ----------
// Se reduce en el navegador (el canvas ya aplica la orientación de la cámara)
function loadPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.92));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo abrir la imagen")); };
    img.src = url;
  });
}

function clearAttachment() {
  attachment = null;
  $("attachPreview").hidden = true;
  $("fileInput").value = "";
}

$("attachBtn").addEventListener("click", () => $("fileInput").click());

// ---------- Voz ----------
// Leer en voz alta: voz en español del propio dispositivo (no se envía nada)
let speakingBtn = null;
function speak(text, btn) {
  if (!("speechSynthesis" in window)) return alert("Este navegador no puede leer en voz alta.");
  const wasThis = speakingBtn === btn && speechSynthesis.speaking;
  speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.textContent = "Escuchar";
  speakingBtn = null;
  if (wasThis) return;
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
  u.lang = "es-ES";
  u.rate = 0.95;
  const voice = speechSynthesis.getVoices().find((v) => v.lang === "es-ES") || speechSynthesis.getVoices().find((v) => v.lang.startsWith("es"));
  if (voice) u.voice = voice;
  u.onend = u.onerror = () => { if (speakingBtn === btn) { btn.textContent = "Escuchar"; speakingBtn = null; } };
  btn.textContent = "Parar";
  speakingBtn = btn;
  speechSynthesis.speak(u);
}

// Hablar: graba en el navegador y transcribe en nuestro servidor (Whisper local)
let recorder = null, recordTimer = null;
const MAX_RECORDING_MS = 60000;
async function toggleRecording() {
  const btn = $("micBtn");
  if (recorder) { recorder.stop(); return; }
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    return alert("Para usar el micrófono, la página debe abrirse con https.\n" +
                 "Pida a quien instaló el asistente la dirección que empieza por https://");
  }
  const conv = conversations[currentId];
  if (!conv) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return alert("No se ha podido usar el micrófono. Revise que el navegador tiene permiso.");
  }
  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg"].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    clearTimeout(recordTimer);
    stream.getTracks().forEach((t) => t.stop());
    const type = recorder.mimeType || mime || "audio/webm";
    recorder = null;
    btn.classList.remove("recording");
    btn.textContent = "Transcribiendo…";
    btn.disabled = true;
    try {
      const blob = new Blob(chunks, { type });
      const dataUrl = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
      const res = await fetch("/api/transcribir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conv.serverId, key: conv.key, audio: dataUrl }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      input.value = (input.value.trim() ? input.value.trim() + " " : "") + data.texto;
      autosize();
      input.focus();
    } catch (e) {
      alert(e.message);
    } finally {
      btn.textContent = "Hablar";
      updateComposer();
    }
  };
  recorder.start();
  btn.classList.add("recording");
  btn.textContent = "Escuchando… pulse para terminar";
  recordTimer = setTimeout(() => recorder && recorder.stop(), MAX_RECORDING_MS);
}
$("micBtn").addEventListener("click", toggleRecording);
$("attachRemove").addEventListener("click", clearAttachment);
$("fileInput").addEventListener("change", async () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  try {
    attachment = { name: file.name, dataUrl: await loadPhoto(file) };
    $("attachThumb").src = attachment.dataUrl;
    $("attachName").textContent = file.name;
    $("attachPreview").hidden = false;
    input.focus();
  } catch (e) {
    alert(e.message);
    clearAttachment();
  }
});
$("newChat").addEventListener("click", newConversation);
$("pdfBtn").addEventListener("click", downloadDraft);
$("deleteBtn").addEventListener("click", () => {
  const conv = conversations[currentId];
  if (conv && confirm("¿Borrar esta conversación y todos sus datos? No se puede deshacer.")) deleteConversation(conv.id);
});
$("deleteAll").addEventListener("click", () => {
  const all = Object.values(conversations);
  if (!all.length || !confirm(`¿Borrar sus ${all.length} conversaciones y todos sus datos? No se puede deshacer.`)) return;
  deleteOnServer(all.map((c) => c.serverId));
  conversations = {};
  saveConversations();
  currentId = null;
  renderSidebar();
  renderThread();
});
$("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("open"));

// Conversaciones de antes del cifrado (sin clave): no se pueden continuar
for (const c of Object.values(conversations)) if (!c.serverId) delete conversations[c.id];
renderSidebar();
renderThread();
loadConfig();
</script>
